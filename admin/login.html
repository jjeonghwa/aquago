<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아쿠아고(aquago) - 관리자 로그인</title>
    <!-- 🚀 [수정] 실시간 디자인 엔진 작동을 위한 정식 라이브러리 주소 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ⛵ [수정] 아이콘 깨짐 현상을 해결하는 구글 공식 아이콘 폰트 링크 -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- 🎨 분리한 커스텀 CSS 파일 링크 -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-gradient-to-tr from-blue-50 to-indigo-100 min-h-screen flex flex-col justify-between p-6">

    <main class="w-full max-w-md mx-auto my-auto space-y-8">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg">
                <span class="material-icons text-3xl">directions_boat</span>
            </div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">아쿠아고 <span class="text-blue-600 font-bold">aquago</span></h1>
            <p class="text-xs text-gray-500 font-medium">요트 스테이 & 바다속구경 관리자 모드</p>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100 space-y-5">
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 block pl-1 mb-1">관리자 아이디</label>
                    <input type="text" id="adminId" value="admin" class="admin-input">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 block pl-1 mb-1">비밀번호</label>
                    <input type="password" id="adminPw" value="1234" class="admin-input">
                </div>
                <button onclick="checkLogin()" class="admin-btn-primary">관리자 로그인 실행</button>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-[10px] text-gray-400">&copy; 2026 aquago.</footer>

    <!-- ⚙️ 분리한 로그인 자바스크립트 파일 로드 -->
    <script src="js/login.js"></script>
</body>
</html>
