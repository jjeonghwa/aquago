<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아쿠아고 관리자 대시보드</title>
    <!-- 구글 머티리얼 아이콘 & 차트 라이브러리 로드 -->
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 1. 왼쪽 고정 프레임 (사이드바 메뉴) -->
    <aside class="sidebar">
        <div class="logo">
            <span class="material-icons">directions_boat</span>
            <span>아쿠아고 관리자</span>
        </div>
        <nav class="menu">
            <a href="#" class="menu-item active" id="btn-dashboard">
                <span class="material-icons">home</span> 대시보드
            </a>
            <a href="#" class="menu-item">
                <span class="material-icons">calendar_today</span> 예약일정
            </a>
            <!-- 새로 추가된 매출 통계 메뉴 -->
            <a href="#" class="menu-item" id="btn-sales">
                <span class="material-icons">bar_chart</span> 매출통계
            </a>
            <a href="#" class="menu-item">
                <span class="material-icons">manage_accounts</span> 운영관리
            </a>
        </nav>
        <a href="#" class="logout-btn">
            <span class="material-icons">logout</span> 로그아웃
        </a>
    </aside>

    <!-- 2. 오른쪽 독립 프레임 (메인 콘텐츠 영역) -->
    <main class="main-content">
        
        <!-- [탭 1] 대시보드 메인 화면 -->
        <div id="section-dashboard" class="content-section">
            <!-- 상단 요약 카드 -->
            <section class="summary-container">
                <h4 class="summary-title">오늘의 운항 및 숙박 현황</h4>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span class="card-label">대기중</span>
                        <span class="card-count count-blue">2건</span>
                    </div>
                    <div class="summary-card">
                        <span class="card-label">요트 운항</span>
                        <span class="card-count count-green">1건</span>
                    </div>
                    <div class="summary-card">
                        <span class="card-label">숙소 입실</span>
                        <span class="card-count count-purple">3건</span>
                    </div>
                </div>
            </section>

            <!-- 신규 예약 신청 리스트 -->
            <section class="reservation-container">
                <h4 class="section-title"><span class="orange-text">fiber_new</span> 신규 예약 신청</h4>
                <div class="reservation-card">
                    <div class="card-header">
                        <span class="badge-orange">요트 + 할머니집</span>
                        <span class="price-text">350,000원</span>
                    </div>
                    <h3 class="customer-name">김바다 (4명)</h3>
                    <p class="reservation-details">
                        ⚠️ 14:00 요트 운항 / 🏡 할머니집 독채 민박
                    </p>
                    <div class="button-group">
                        <button class="btn btn-reject">거절하기</button>
                        <button class="btn btn-confirm">예약 확정</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- [탭 2] 매출 통계 화면 (기본 상태는 숨김) -->
        <div id="section-sales" class="content-section" style="display: none;">
            <div class="page-header">
                <h2>매출 통계 분석</h2>
                <p class="subtitle">월별 전체 매출 추이를 차트로 확인하세요.</p>
            </div>
            <!-- 실제 차트가 그려질 캔버스 카드 -->
            <div class="chart-card-wrapper">
                <h3>월별 매출 추이 (상반기)</h3>
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- 자바스크립트 연결 -->
    <script src="./js/main.js"></script>
</body>
</html>
