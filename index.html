<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아쿠아go! - 요트예약</title>
    <!-- 🎨 외부로 완벽히 분리한 스타일시트 링크 -->
    <link rel="stylesheet" href="css/user.css">
</head>
<body>

    <!-- 앱 전체 고정 틀 -->
    <div class="app-container">
        
        <!-- 상단 고정 네이비 바 -->
        <header class="app-header">
            <h1>아쿠아고 (aquago)</h1>
            <p>동해안 요트스테이 & 바다속구경</p>
        </header>

        <!-- 본문 콘텐츠 영역 -->
        <div class="app-content">
            
            <!-- [화면 1] 투어 코스 선택 -->
            <div id="user-page-1">
                <h2 class="page-title">원하시는 투어 코스를 선택하세요</h2>
                
                <button onclick="selectProduct('바다 속 구경 코스 (오전 10:00)')" class="card-button">
                    <p class="card-title">🤿 스노클링 & 바다 속 구경</p>
                    <p class="card-desc">오전 10:00 출항 (장비 대여 일체 포함)</p>
                </button>

                <button onclick="selectProduct('시골집 독채 패키지 (오후 14:00)')" class="card-button">
                    <p class="card-title">🏡 요트 투어 + 시골집 독채</p>
                    <p class="card-desc">오후 14:00 출항 (프라이빗 시골 민박 1박 연계)</p>
                </button>
            </div>

            <!-- [화면 2] 탑승 인원 설정 -->
            <div id="user-page-2" class="hidden">
                <div class="info-box">
                    <p>선택하신 예약 스케줄</p>
                    <p id="selected-product-display">-</p>
                </div>

                <div class="counter-row">
                    <span class="counter-label">탑승 총 인원</span>
                    <div class="counter-group">
                        <button onclick="changeCount(-1)" class="btn-circle">-</button>
                        <span id="people-count" class="count-num">1</span>
                        <button onclick="changeCount(1)" class="btn-circle">+</button>
                    </div>
                </div>

                <div class="btn-group">
                    <button onclick="goBack(1)" class="btn-back">뒤로가기</button>
                    <button onclick="submitReservation()" class="btn-submit">탑승권 발권하기</button>
                </div>
            </div>

            <!-- [화면 3] 발권 완료 모바일 티켓 -->
            <div id="user-page-3" class="hidden text-center">
                <div class="status-message">
                    <p class="status-success">✓ 예약 신청 접수 완료</p>
                    <p class="status-desc">담당자가 배편 확인 후 확인 문자를 보내드립니다.</p>
                </div>

                <div class="ticket-box">
                    <div class="ticket-row">
                        <span class="ticket-label">선택 코스</span>
                        <span id="ticket-product" class="ticket-value">-</span>
                    </div>
                    <div class="ticket-row">
                        <span class="ticket-label">탑승 인원</span>
                        <span id="ticket-people" class="ticket-value">1명</span>
                    </div>
                    <div class="ticket-row ticket-dashed-top">
                        <span class="ticket-label">예약 인증코드</span>
                        <span class="ticket-code">AQG7794X</span>
                    </div>
                </div>

                <button onclick="goBack(1)" class="btn-full">메인 홈으로 돌아가기</button>
            </div>
        </div>

    </div>

    <!-- ⚙️ 외부로 분리한 제어 스크립트 링크 -->
    <script src="js/user.js"></script>
</body>
</html>
